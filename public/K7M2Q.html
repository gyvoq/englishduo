<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Aula 1 · Inglês para Comissários</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#fff; --ink:#1b2433; --muted:#5b6577; --blue:#1f5fbf; --soft:#e8eefc;
    --ok:#1a8f5a; --okbg:#e3f6ec; --bad:#c8372d; --badbg:#fde8e6; --line:#dfe4ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  h1{font-family:Georgia,serif;font-size:clamp(20px,4.5vw,28px);margin:0}
  .score{font-weight:700;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:14px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s ease}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(20,30,60,.06);animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .q{font-size:clamp(18px,4vw,22px);font-weight:700;margin:6px 0 4px;line-height:1.35}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .opts{display:grid;gap:10px}
  .opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,background .15s,transform .1s;font-size:16px;line-height:1.35}
  .opt:hover:not([disabled]){border-color:var(--blue);background:var(--soft)}
  .opt:active:not([disabled]){transform:scale(.99)}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .opt b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--blue);font-size:13px}
  .opt[disabled]{cursor:default}
  .opt .why{display:none;font-size:14px;color:var(--muted);margin-top:6px}
  .opt.show .why{display:block}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt.dim{opacity:.75}
  .opt.ok.picked{animation:pop .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .fb{margin-top:16px;padding:14px;border-radius:12px;font-size:15px;line-height:1.45;display:none;animation:in .3s}
  .fb.ok{display:block;background:var(--okbg);border-left:5px solid var(--ok)}
  .fb.bad{display:block;background:var(--badbg);border-left:5px solid var(--bad)}
  .fb strong{display:block;font-size:17px;margin-bottom:4px}
  .pron{display:inline-block;margin-top:6px;font-style:italic;color:var(--muted)}
  .actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
  .btn{all:unset;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;text-align:center}
  .btn.ghost{background:var(--soft);color:var(--blue)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .hidden{display:none!important}
  .big{font-size:clamp(40px,10vw,64px);font-weight:800;color:var(--blue);text-align:center;margin:6px 0}
  .msg{text-align:center;color:var(--muted);margin-bottom:18px}
  .key{display:grid;gap:10px;margin-top:10px}
  .k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
  .k .kq{font-weight:700;margin-bottom:4px}
  .k.ok{border-left:5px solid var(--ok)} .k.bad{border-left:5px solid var(--bad)}
  .k .you{color:var(--bad)} .k .ans{color:var(--ok);font-weight:600}
  .toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-80px);padding:10px 18px;border-radius:999px;font-weight:800;color:#fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1);z-index:9;pointer-events:none}
  .toast.on{transform:translate(-50%,0)}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:8}
  @media (max-width:480px){.card{padding:16px}.opt{padding:12px;font-size:15px}.actions .btn{flex:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>Quiz · Aula 1 ✈️</h1>
    <span class="score" id="score">0 / 0</span>
  </header>
  <div class="bar"><i id="prog"></i></div>

  <section class="card" id="quiz">
    <div class="tag" id="tag"></div>
    <div class="q" id="q"></div>
    <div class="sub" id="sub"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="actions"><button class="btn hidden" id="next">Próxima →</button></div>
  </section>

  <section class="card hidden" id="end">
    <div class="tag" style="text-align:center">Resultado final</div>
    <div class="big" id="final"></div>
    <div class="msg" id="finalMsg"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="restart">Refazer quiz</button>
      <button class="btn ghost" id="wrongOnly">Refazer só os erros</button>
    </div>
    <h2 style="font-size:18px;margin:24px 0 4px">Gabarito</h2>
    <div class="key" id="key"></div>
  </section>
</div>

<script>
const QUESTIONS = [
  {tag:"Cumprimentos", q:"Como se diz “Bem-vindo a bordo!”?", a:0,
   pron:"uélcam abórd",
   o:[["Welcome aboard!","Correto. “Aboard” significa “a bordo”. É a frase padrão para receber o passageiro na porta."],
      ["Welcome to board!","“Board” sozinho é o verbo “embarcar” ou a prancha. “To board” = “para embarcar”, não “a bordo”."],
      ["Good aboard!","“Good” não é usado para dar boas-vindas. O certo é “Welcome”."],
      ["Welcome in the plane!","Soa traduzido do português. Ninguém fala assim a bordo; o natural é “Welcome aboard!”."]]},
  {tag:"Cumprimentos", q:"O passageiro diz “Nice to meet you.” O que isso significa?", a:2,
   pron:"náis tu mít iu",
   o:[["Como vai você?","“Como vai você?” é “How are you?”."],
      ["Bom dia!","“Bom dia” é “Good morning”."],
      ["Prazer em conhecer.","Correto. Usado quando você conhece alguém pela primeira vez."],
      ["Até logo.","“Até logo” é “See you later”."]]},
  {tag:"Apresentação", q:"Qual frase está correta para dizer sua idade?", a:1,
   pron:"áim … iérs ôuld",
   o:[["I have 25 years.","Erro clássico de brasileiro! Em inglês a idade usa o verbo “to be”, não “have”."],
      ["I’m 25 years old.","Correto. Em inglês você “é” a idade: I am (I’m) + número + years old."],
      ["I’m have 25 years old.","Mistura dois verbos (am + have). Só o “I’m” é necessário."],
      ["My age have 25.","Gramática errada e soa estranho. Use “I’m 25 years old”."]]},
  {tag:"Apresentação", q:"Como dizer “Quero trabalhar como comissário(a)”?", a:3,
   pron:"ai uânt tu uârk as a flait atêndant",
   o:[["I want work like flight attendant.","Faltam o “to” antes de “work” e o artigo “a”. E “like” aqui significa “parecido com”, não “como profissão”."],
      ["I want to working as a flight attendant.","Depois de “want to” o verbo fica na forma base: “work”, não “working”."],
      ["I wanting to work as flight attendant.","“I wanting” não existe. O certo é “I want”. Também falta o artigo “a”."],
      ["I want to work as a flight attendant.","Correto. want to + verbo, “as” para profissão e o artigo “a” antes da profissão."]]},
  {tag:"Quando não sabe a palavra", q:"Você não entendeu o passageiro. O que dizer?", a:0,
   pron:"cud iu ripít dét?",
   o:[["Could you repeat that?","Correto e educado: “Pode repetir?”. Também serve “Could you speak more slowly?”."],
      ["What you said?","Gramática errada e soa rude. Prefira “Could you repeat that?”."],
      ["Repeat!","Imperativo seco, soa grosseiro com passageiro."],
      ["I don’t speak.","Significa “eu não falo”. Não ajuda o passageiro e nem é verdade 😉"]]},
  {tag:"Quando não sabe a palavra", q:"Como perguntar “O que significa ‘aisle’?”", a:2,
   pron:"uót dâz … min?",
   o:[["What means “aisle”?","Em perguntas com verbo comum, o inglês precisa do auxiliar “does”."],
      ["What is mean “aisle”?","“is” + “mean” não combina. O auxiliar certo é “does”."],
      ["What does “aisle” mean?","Correto: What + does + palavra + mean?"],
      ["How do you say “aisle”?","Isso pergunta como se diz algo em inglês, não o que significa."]]},
  {tag:"Recebendo o passageiro", q:"Qual é a forma educada de pedir o cartão de embarque?", a:1,
   pron:"mei ai si iór bórdin pés, plíz?",
   o:[["Give me your boarding pass.","Ordem direta, sem “please”. Soa rude para um comissário."],
      ["May I see your boarding pass, please?","Correto. “May I…?” é a forma mais educada de pedir permissão."],
      ["Can you see my boarding pass?","Inverte o sentido: você está pedindo para o passageiro ver o SEU cartão."],
      ["Where is your ticket boarding?","Ordem errada das palavras: é “boarding pass”, e a pergunta fica estranha."]]},
  {tag:"Recebendo o passageiro", q:"O passageiro entrega o cartão e diz:", a:3,
   pron:"ríar iu gôu",
   o:[["Here you are going.","Não é uma expressão em inglês."],
      ["You go here.","Significa “você vai aqui”, não é entregar algo."],
      ["Take it you.","Gramática errada."],
      ["Here you go.","Correto: “Aqui está.” Usado ao entregar algo. “Here you are” também serve."]]},
  {tag:"Assentos e números", q:"“Your seat is 12A, on the left.” Onde fica o assento?", a:0,
   pron:"iór síit is tuélv êi, on dê léft",
   o:[["Fileira 12, assento A, à esquerda.","Correto. “Left” = esquerda, “right” = direita."],
      ["Fileira 12, assento A, à direita.","“Right” é direita. Aqui a frase diz “left” = esquerda."],
      ["Fileira 2, assento 1A, à esquerda.","“Twelve” é 12. O número inteiro é a fileira e a letra é o assento."],
      ["Assento 12, na saída.","Não fala nada sobre saída (“exit”)."]]},
  {tag:"Assentos e números", q:"Qual é a diferença entre “fifteen” e “fifty”?", a:2,
   pron:"fifTÍIN · FÍFti",
   o:[["Nenhuma, é o mesmo número.","São números diferentes, por isso é tão importante a pronúncia!"],
      ["Fifteen = 50 e fifty = 15.","Invertido. “-teen” é de 13 a 19 e “-ty” são as dezenas."],
      ["Fifteen = 15 (acento no fim) e fifty = 50 (acento no começo).","Correto: fifTEEN vs FIFty. A sílaba forte muda tudo na hora de dizer o assento."],
      ["Fifteen = 5 e fifty = 50.","5 é “five”. Fifteen é 15."]]},
  {tag:"Assentos e números", q:"“Window or aisle?” O que o passageiro está escolhendo?", a:1,
   pron:"uíndou or áil?",
   o:[["Janela ou saída","“Exit” é saída. “Aisle” é corredor."],
      ["Janela ou corredor","Correto. E atenção: o “s” de “aisle” é mudo: “áil”."],
      ["Frente ou fundo","Frente é “front”, fundo é “back”."],
      ["Primeira ou econômica","Isso seria “first class or economy”."]]},
  {tag:"Bebidas e refeições", q:"Como oferecer algo para beber de forma educada?", a:3,
   pron:"uud iu laik sâmthin tu drínk?",
   o:[["Do you want drink?","Falta o “to/a” e “do you want” é mais direto. A bordo use “Would you like”."],
      ["You like something drink?","Faltam o auxiliar e o “to”. Fica “Would you like something to drink?”."],
      ["Want something for drinking?","Informal e gramaticalmente incompleto."],
      ["Would you like something to drink?","Correto. “Would you like…?” é a forma educada de oferecer."]]},
  {tag:"Bebidas e refeições", q:"Você entrega a refeição. O que dizer?", a:0,
   pron:"ríar iu ar. endjói iór míl",
   o:[["Here you are. Enjoy your meal!","Correto: “Aqui está. Bom apetite!”"],
      ["Take your food.","Soa seco e mandão."],
      ["Good food for you!","Não é uma expressão em inglês."],
      ["Eat well, please.","Estranho. O natural é “Enjoy your meal!”."]]},
  {tag:"Segurança", q:"“Please fasten your seatbelt.” O que o passageiro deve fazer?", a:2,
   pron:"plíz fásen iór síit bélt",
   o:[["Desligar o celular","Isso é “Please turn off your phone.”."],
      ["Voltar o assento para cima","Isso é “Please put your seat upright.”."],
      ["Afivelar o cinto","Correto. “Fasten” = afivelar/prender. O “t” é mudo: “fásen”."],
      ["Fechar a mesinha","Isso é “Please keep your tray table closed.”."]]},
  {tag:"Segurança", q:"Como dizer “Mantenha a mesinha fechada”?", a:1,
   pron:"plíz kíp iór trêi têibol clôuzd",
   o:[["Please close your table tray.","A ordem é “tray table” (mesinha de bandeja), não “table tray”."],
      ["Please keep your tray table closed.","Correto. Keep + objeto + closed = “mantenha … fechado”."],
      ["Please put your seat upright.","Isso é sobre o encosto da poltrona, não a mesinha."],
      ["Please turn off your table.","“Turn off” é desligar aparelho. Mesinha não se desliga 🙂"]]},
  {tag:"Pedidos", q:"“Where is the restroom?” Qual a melhor resposta?", a:3,
   pron:"its at dê béck, on iór léft",
   o:[["About two hours.","Responde “How long is the flight?”, não onde fica o banheiro."],
      ["Sure! Here you go.","Serve para entregar algo, por exemplo água ou cobertor."],
      ["Let me check for you.","Até pode ser usado, mas a pergunta tem resposta direta: onde fica o banheiro."],
      ["It’s at the back, on your left.","Correto: “Fica no fundo, à sua esquerda.” Restroom = banheiro."]]},
  {tag:"Pedidos", q:"“Can I have a blanket?” O que o passageiro pediu?", a:0,
   pron:"quén ai rév a blénkit?",
   o:[["Um cobertor","Correto. Resposta: “Of course! One moment, please.”"],
      ["Um travesseiro","Travesseiro é “pillow”."],
      ["Um copo d’água","Isso seria “Could I have some water?”."],
      ["Trocar de assento","Isso é “Can I change my seat?”."]]},
  {tag:"Avisos", q:"“We are about to land.” Significa:", a:2,
   pron:"uí ar abáut tu lénd",
   o:[["Vamos decolar em breve.","Decolar é “take off”: “We will take off soon.”."],
      ["Estamos voando sobre a terra.","“About to” não é “sobre”. Indica algo que vai acontecer em instantes."],
      ["Estamos prestes a pousar.","Correto. “Be about to” = estar prestes a. “Land” = pousar."],
      ["O voo dura duas horas.","Isso é “The flight time is two hours.”."]]},
  {tag:"Frases educadas", q:"Um passageiro esperou muito. O que você diz?", a:1,
   pron:"thênk iu fór iór pêishens",
   o:[["Just wait.","Soa impaciente e rude."],
      ["Thank you for your patience.","Correto: “Obrigada pela paciência.” Educado e profissional."],
      ["Don’t be nervous.","Não tem relação com a espera, e pode soar como bronca."],
      ["Is everything OK?","Pergunta se está tudo bem, mas não agradece a espera."]]},
  {tag:"Frases educadas", q:"Um passageiro está nervoso. Qual frase acalma?", a:3,
   pron:"dôunt uóri, évrithin is fain",
   o:[["Let me check for you.","Bom para verificar algo, mas não acalma ninguém."],
      ["The exits are here.","Pode deixar o passageiro mais nervoso 😅"],
      ["Please take your seats.","É um aviso geral, não acalma."],
      ["Don’t worry, everything is fine.","Correto: “Não se preocupe, está tudo bem.”"]]}
];

const $ = id => document.getElementById(id);
let order=[], idx=0, score=0, answers=[];

function start(list){
  order = list ?? QUESTIONS.map((_,i)=>i);
  idx=0; score=0; answers=[];
  $('end').classList.add('hidden'); $('quiz').classList.remove('hidden');
  render();
}

function render(){
  const Q = QUESTIONS[order[idx]];
  $('tag').textContent = `Questão ${idx+1} de ${order.length} · ${Q.tag}`;
  $('q').textContent = Q.q;
  $('sub').textContent = 'Toque na resposta certa.';
  $('fb').className='fb'; $('fb').innerHTML='';
  $('next').classList.add('hidden');
  $('score').textContent = `${score} / ${idx}`;
  $('prog').style.width = (idx/order.length*100)+'%';
  const box=$('opts'); box.innerHTML='';
  Q.o.forEach(([t,why],i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<b>${'ABCD'[i]}</b><span><span class="t"></span><span class="why"></span></span>`;
    b.querySelector('.t').textContent=t;
    b.querySelector('.why').textContent=why;
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
  const card=$('quiz'); card.style.animation='none'; card.offsetHeight; card.style.animation='';
}

function pick(i){
  const Q=QUESTIONS[order[idx]], btns=[...$('opts').children], right=i===Q.a;
  btns.forEach((b,j)=>{
    b.disabled=true; b.classList.add('show');
    if(j===Q.a) b.classList.add('ok');
    else if(j===i) b.classList.add('bad');
    else b.classList.add('dim');
  });
  btns[i].classList.add('picked');
  answers.push({q:order[idx], pick:i, right});
  if(right){ score++; confetti(btns[i]); toast('Acertou! 🎉','var(--ok)'); }
  else { toast('Errou! 😬','var(--bad)'); if(navigator.vibrate) try{navigator.vibrate(120)}catch(e){} }
  const fb=$('fb');
  fb.className='fb '+(right?'ok':'bad');
  fb.innerHTML = right
    ? `<strong>✅ Isso aí!</strong>`
    : `<strong>❌ Não foi dessa vez.</strong>Você marcou <b>${'ABCD'[i]}</b>. A resposta certa é <b>${'ABCD'[Q.a]}</b>: “<span class="r"></span>”.<br>`;
  if(!right) fb.querySelector('.r').textContent=Q.o[Q.a][0];
  const why=document.createElement('div'); why.textContent=Q.o[Q.a][1]; fb.appendChild(why);
  const p=document.createElement('span'); p.className='pron'; p.textContent='🗣️ Pronúncia: '+Q.pron; fb.appendChild(p);
  $('score').textContent=`${score} / ${idx+1}`;
  $('prog').style.width=((idx+1)/order.length*100)+'%';
  const nx=$('next'); nx.textContent = idx===order.length-1 ? 'Ver resultado →' : 'Próxima →';
  nx.classList.remove('hidden'); nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

$('next').onclick=()=>{ idx++; idx<order.length ? render() : finish(); window.scrollTo({top:0,behavior:'smooth'}); };

function finish(){
  $('quiz').classList.add('hidden'); $('end').classList.remove('hidden');
  const pct=Math.round(score/order.length*100);
  $('final').textContent=`${score}/${order.length}`;
  $('finalMsg').textContent = pct===100?'Perfeito! Pronto(a) para voar! ✈️'
    : pct>=75?`Muito bom! ${pct}% de acerto. Revise os erros abaixo.`
    : pct>=50?`${pct}% de acerto. Dá uma revisada no gabarito e tenta de novo.`
    : `${pct}% de acerto. Sem problema: leia o gabarito com calma e refaça os erros.`;
  if(pct>=75) burst(innerWidth/2, innerHeight/3, 140);
  const wrong=answers.filter(a=>!a.right);
  $('wrongOnly').classList.toggle('hidden', wrong.length===0);
  const key=$('key'); key.innerHTML='';
  answers.forEach((a,n)=>{
    const Q=QUESTIONS[a.q], d=document.createElement('div');
    d.className='k '+(a.right?'ok':'bad');
    d.innerHTML=`<div class="kq"></div><div class="you"></div><div class="ans"></div><div class="w"></div>`;
    d.querySelector('.kq').textContent=`${n+1}. ${Q.q}`;
    if(!a.right) d.querySelector('.you').textContent=`✗ Sua resposta: ${Q.o[a.pick][0]} (${Q.o[a.pick][1]})`;
    d.querySelector('.ans').textContent=`✓ ${'ABCD'[Q.a]}) ${Q.o[Q.a][0]}`;
    d.querySelector('.w').textContent=Q.o[Q.a][1]+'  🗣️ '+Q.pron;
    key.appendChild(d);
  });
}
$('restart').onclick=()=>start();
$('wrongOnly').onclick=()=>start(answers.filter(a=>!a.right).map(a=>a.q));

/* toast */
let tt; function toast(t,c){const e=$('toast');e.textContent=t;e.style.background=c;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1100);}

/* confetti */
const cv=$('fx'), ctx=cv.getContext('2d'); let parts=[], raf=null;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);} size(); addEventListener('resize',size);
function confetti(el){const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 60);}
function burst(x,y,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#1f5fbf','#1a8f5a','#f2b705','#e8505b','#7b5cd6'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, s=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,w:5+Math.random()*5,h:3+Math.random()*4,c:cols[i%cols.length],life:70+Math.random()*30,spin:(Math.random()-.5)*.3});}
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=p.spin;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
  raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,innerWidth,innerHeight), null);
}

start();
</script>
