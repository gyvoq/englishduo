<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Aula 1 · Inglês para Comissários</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#fff; --ink:#1b2433; --muted:#5b6577; --blue:#1f5fbf; --soft:#e8eefc;
    --ok:#1a8f5a; --okbg:#e3f6ec; --bad:#c8372d; --badbg:#fde8e6; --line:#dfe4ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  h1{font-family:Georgia,serif;font-size:clamp(20px,4.5vw,28px);margin:0}
  .score{font-weight:700;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:14px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s ease}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(20,30,60,.06);animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .q{font-size:clamp(18px,4vw,22px);font-weight:700;margin:6px 0 4px;line-height:1.35}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .opts{display:grid;gap:10px}
  .opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,background .15s,transform .1s;font-size:16px;line-height:1.35}
  .opt:hover:not([disabled]){border-color:var(--blue);background:var(--soft)}
  .opt:active:not([disabled]){transform:scale(.99)}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .opt b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--blue);font-size:13px}
  .opt[disabled]{cursor:default}
  .opt .why{display:none;font-size:14px;color:var(--muted);margin-top:6px}
  .opt.show .why{display:block}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt.dim{opacity:.75}
  .opt.ok.picked{animation:pop .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .fb{margin-top:16px;padding:14px;border-radius:12px;font-size:15px;line-height:1.45;display:none;animation:in .3s}
  .fb.ok{display:block;background:var(--okbg);border-left:5px solid var(--ok)}
  .fb.bad{display:block;background:var(--badbg);border-left:5px solid var(--bad)}
  .fb strong{display:block;font-size:17px;margin-bottom:4px}
  .pron{display:inline-block;margin-top:6px;font-style:italic;color:var(--muted)}
  .actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
  .btn{all:unset;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;text-align:center}
  .btn.ghost{background:var(--soft);color:var(--blue)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .hidden{display:none!important}
  .big{font-size:clamp(40px,10vw,64px);font-weight:800;color:var(--blue);text-align:center;margin:6px 0}
  .msg{text-align:center;color:var(--muted);margin-bottom:18px}
  .key{display:grid;gap:10px;margin-top:10px}
  .k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
  .k .kq{font-weight:700;margin-bottom:4px}
  .k.ok{border-left:5px solid var(--ok)} .k.bad{border-left:5px solid var(--bad)}
  .k .you{color:var(--bad)} .k .ans{color:var(--ok);font-weight:600}
  .toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-80px);padding:10px 18px;border-radius:999px;font-weight:800;color:#fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1);z-index:9;pointer-events:none}
  .toast.on{transform:translate(-50%,0)}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:8}
  @media (max-width:480px){.card{padding:16px}.opt{padding:12px;font-size:15px}.actions .btn{flex:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>Quiz · Aula 1 ✈️</h1>
    <span class="score" id="score">0 / 0</span>
  </header>
  <div class="bar"><i id="prog"></i></div>

  <section class="card" id="quiz">
    <div class="tag" id="tag"></div>
    <div class="q" id="q"></div>
    <div class="sub" id="sub"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="actions"><button class="btn hidden" id="next">Próxima →</button></div>
  </section>

  <section class="card hidden" id="end">
    <div class="tag" style="text-align:center">Resultado final</div>
    <div class="big" id="final"></div>
    <div class="msg" id="finalMsg"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="restart">Refazer quiz</button>
      <button class="btn ghost" id="wrongOnly">Refazer só os erros</button>
    </div>
    <h2 style="font-size:18px;margin:24px 0 4px">Gabarito</h2>
    <div class="key" id="key"></div>
  </section>
</div>

<script src="/quiz-k7m2q.js"></script>
</body>
</html>
