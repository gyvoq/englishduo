<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Obrigado! · EnglishDuo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'16'%20fill%3D'%23D7191F'%2F%3E%3Ctext%20x%3D'32'%20y%3D'46'%20font-size%3D'40'%20font-weight%3D'800'%20font-family%3D'Arial%2CHelvetica%2Csans-serif'%20text-anchor%3D'middle'%20fill%3D'%23fff'%3EE%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
@font-face{font-family:"Geist";src:url(/fonts/geist.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--paper:#FFFFFF;--ink:#0D0D0D;--ink-2:#5A5A5A;--line:#E3E3E3;--wash:#F5F5F5;--red:#D7191F;--red-deep:#B3121A;--red-wash:#FCEBEC;--green:#16A34A;--green-wash:#EAF7EF;--r-md:14px;--r-lg:20px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:32px;line-height:56px;margin:0 auto 20px}
.ok{display:inline-block;background:var(--green-wash);color:var(--green);font-weight:650;font-size:.875rem;padding:4px 12px;border-radius:999px;margin-bottom:12px}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 8px;font-weight:750}
p{margin:0 0 24px;color:var(--ink-2)}
.box{background:var(--wash);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.label{font-size:.8125rem;color:var(--ink-2);margin-bottom:8px}
.code{font-size:1.5rem;font-weight:750;letter-spacing:1px;color:var(--red);word-break:break-all;user-select:all}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:0 20px;border-radius:var(--r-md);font:650 1rem "Geist",system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .12s,background-color .15s}
.btn:active{transform:scale(.98)}
.btn-red{background:var(--red);color:#fff;border:0}
.btn-line{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);margin-bottom:12px}
@media(hover:hover){.btn-red:hover{background:var(--red-deep)}.btn-line:hover{background:var(--wash)}}
</style>
</head>
<body>
<main>
<div class="logo">E</div>
<span class="ok">Pagamento confirmado</span>
<h1>Obrigado pela compra!</h1>
<p>Seu acesso está liberado. Use o código abaixo para entrar.</p>
<div class="box">
<div class="label">Seu código de acesso</div>
<div class="code" id="code">ED-7Q9U-TKLB-2XND</div>
</div>
<button type="button" class="btn btn-line" id="copy">Copiar código</button>
<a class="btn btn-red" href="/?chave=ED-7Q9U-TKLB-2XND">Entrar agora</a>
</main>
<script>
(function () {
  var b = document.getElementById('copy');
  var t = document.getElementById('code').textContent;
  b.addEventListener('click', function () {
    function ok() { b.textContent = 'Copiado!'; setTimeout(function () { b.textContent = 'Copiar código'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, function () {});
    } else {
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('code'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); ok(); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
